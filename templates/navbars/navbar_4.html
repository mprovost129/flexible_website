{% load static %}
<header class="p-3 text-bg-dark mb-4">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="{% url 'core:home' %}" class="d-flex align-items-center mb-2 mb-lg-0 me-lg-auto text-white text-decoration-none">
                {% if site.logo %}
                    <img src="{{ site.logo.url }}" alt="{{ site.name }}" height="32" class="me-2">
                {% endif %}
                <span class="fs-4">{{ site.name }}</span>
            </a>
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                {% for p in site.pages.all %}
                    {% if p.is_enabled %}
                        <li>
                            <a href="{% url 'core:page' p.slug %}"
                               class="nav-link px-2 {% if request.resolver_match.kwargs.slug == p.slug %}text-secondary{% else %}text-white{% endif %}">
                                {{ p.title }}
                            </a>
                        </li>
                    {% endif %}
                {% endfor %}
            </ul>
            <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search" action="#" method="get">
                <input type="search" class="form-control form-control-dark text-bg-dark" placeholder="Search..." aria-label="Search" name="q">
            </form>
            <div class="text-end">
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="btn btn-outline-light">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light me-2">Login</a>
                    <a href="{% url 'login' %}" class="btn btn-warning">Sign-up</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
