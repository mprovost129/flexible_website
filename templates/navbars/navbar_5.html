<header class="mb-4">
    <div class="px-3 py-2 text-bg-dark border-bottom">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="{% url 'core:home' %}" class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                    {% if site.logo %}
                        <img src="{{ site.logo.url }}" alt="{{ site.name }}" height="32" class="me-2">
                    {% endif %}
                    <span class="fs-4">{{ site.name }}</span>
                </a>
                <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small">
                    {% for p in site.pages.all %}
                        {% if p.is_enabled %}
                            <li>
                                <a href="{% url 'core:page' p.slug %}"
                                   class="nav-link {% if request.resolver_match.kwargs.slug == p.slug %}text-secondary{% else %}text-white{% endif %}">
                                    <i class="bi bi-circle d-block mx-auto mb-1"></i>
                                    {{ p.title }}
                                </a>
                            </li>
                        {% endif %}
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
    <div class="px-3 py-2 border-bottom">
        <div class="container d-flex flex-wrap justify-content-center">
            <form class="col-12 col-lg-auto mb-2 mb-lg-0 me-lg-auto" role="search" action="#" method="get">
                <input type="search" class="form-control" placeholder="Search..." aria-label="Search" name="q">
            </form>
            <div class="text-end">
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="btn btn-light text-dark">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-light text-dark me-2">Login</a>
                    <a href="{% url 'login' %}" class="btn btn-primary">Sign-up</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
