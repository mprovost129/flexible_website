{% load static %}
<div class="container">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
        <div class="col-md-3 mb-2 mb-md-0">
            <a href="{% url 'core:home' %}" class="d-inline-flex link-body-emphasis text-decoration-none align-items-center">
                {% if site.logo %}
                    <img src="{{ site.logo.url }}" alt="{{ site.name }}" height="32" class="me-2">
                {% endif %}
                <span class="fs-4">{{ site.name }}</span>
            </a>
        </div>
        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            {% for p in site.pages.all %}
                {% if p.is_enabled %}
                    <li>
                        <a href="{% url 'core:page' p.slug %}"
                           class="nav-link px-2 {% if request.resolver_match.kwargs.slug == p.slug %}link-secondary{% endif %}">
                            {{ p.title }}
                        </a>
                    </li>
                {% endif %}
            {% endfor %}
        </ul>
        <div class="col-md-3 text-end">
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="btn btn-outline-primary">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Login</a>
                <a href="{% url 'login' %}" class="btn btn-primary">Sign-up</a>
            {% endif %}
        </div>
    </header>
</div>
