# Standalone deploy blueprint for the CBL License Server (seller-only).
# Deploy this as its OWN Render service, separate from the product.
services:
  - type: web
    name: cbl-license-server
    runtime: python
    plan: free
    region: oregon
    rootDir: license_server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true        # dashboard password; view it in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.12"
      # SQLite lives on the instance's disk. On Render's free tier the disk is
      # ephemeral (wiped on redeploy), so data resets periodically - fine for a
      # lightweight tracker since installs re-ping within a day. For durable
      # history, attach a Render Disk (paid) and set LICENSE_DB to a path on it,
      # or swap SQLite for a managed database.
      # - key: LICENSE_DB
      #   value: /var/data/licenses.db
